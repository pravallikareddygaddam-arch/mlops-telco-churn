
name: Lab 11 - Prepare Deployment

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build normal MLOps pipeline
        run: python src/mlops_pipeline/churn_prediction_pipeline.py

      - name: Run Lab 11 deployment preparation
        run: python src/mlops_pipeline/11_prepare_deployment.py

      - name: Verify deployment artifacts
        run: |
          test -f deployment/model.pkl
          test -f deployment/preprocessor.pkl
          test -f deployment/model_metadata.json
          echo "All deployment artifacts verified."

      - name: Upload Lab 11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11-deployment-${{ github.run_number }}
          path: |
            deployment/**
            reports/**
            artifacts/**
          if-no-files-found: ignore
