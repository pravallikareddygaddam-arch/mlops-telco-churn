
name: Lab 10 - Failure and Recovery Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-tests:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the normal MLOps pipeline
        run: |
          python src/mlops_pipeline/churn_prediction_pipeline.py

      - name: Register model for Lab 10 recovery
        run: |
          python src/mlops_pipeline/05_train_registry.py

      - name: Run Lab 10 failure and recovery tests
        run: |
          python src/mlops_pipeline/10_failure_injection.py

      - name: Verify Lab 10 report
        if: always()
        run: |
          test -f reports/lab9_failure_handling_report.json || exit 1
          echo "Lab 10 report generated."

      - name: Upload Lab 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab10-failure-tests-${{ github.run_number }}
          path: |
            reports/**
            artifacts/**
            logs/**
            mlruns/**
            mlflow.db
          if-no-files-found: ignore
