<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container"><span class="navbar-brand">Vignan | Student Management</span></div>
</nav>
<div class="container py-5">
    <h2 class="mb-4">Student Management System</h2>
    <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">Add Student</div>
        <div class="card-body">
            <form th:action="@{/students}" th:object="${student}" method="post" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Name</label>
                    <input class="form-control" th:field="*{name}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Department</label>
                    <input class="form-control" th:field="*{department}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Year</label>
                    <input type="number" min="1" max="4" class="form-control" th:field="*{year}" required>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">Add</button>
                </div>
            </form>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-header fw-bold">Student Records</div>
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Department</th><th>Year</th></tr></thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.id}"></td><td th:text="${s.name}"></td>
                    <td th:text="${s.department}"></td><td th:text="${s.year}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
